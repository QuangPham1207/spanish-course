<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Verb conjugation cheatsheet — Spanish course</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#6b7280;
    --accent:#c2410c; --card:#f7f6f4; --border:#e4e2de;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121212; --fg:#e9e9e9; --muted:#a1a1aa;
      --accent:#fb923c; --card:#1c1c1e; --border:#2e2e30;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
      "Helvetica Neue",Arial,sans-serif;
    font-size:17px; line-height:1.7;
  }
  .pagenav{max-width:900px; margin:0 auto; padding:1.2rem 1.1rem 0}
  .pagenav a{
    color:var(--accent); text-decoration:none; font-size:.9rem; font-weight:600;
  }
  .pagenav a:hover{text-decoration:underline}
</style>
</head>
<body>

<p class="pagenav"><a href="../index.html">&larr; Home</a></p>

<!-- The cheatsheet is a shared component (conjugation-modal.js). Here it
     mounts inline; in the lessons the same component opens as a modal. -->
<div id="conjugation-root"></div>

<script src="conjugation-modal.js"></script>
</body>
</html>
